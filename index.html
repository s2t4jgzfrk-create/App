<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Water Sort Puzzle</title>
    <style>
        body { 
            background: #121212; color: white; text-align: center; 
            font-family: -apple-system, system-ui, sans-serif; 
            margin: 0; padding: 20px; user-select: none;
        }
        h1 { font-size: 24px; margin-top: 30px; margin-bottom: 5px; }
        #status { color: #aaa; font-size: 14px; min-height: 20px; margin-bottom: 30px; }
        .game-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .tube { 
            width: 48px; height: 150px; border: 3px solid #555; 
            border-radius: 0 0 15px 15px; display: flex; 
            flex-direction: column-reverse; overflow: hidden;
            background: rgba(255,255,255,0.02); transition: transform 0.2s;
        }
        .tube.selected { border-color: #ff9800; transform: translateY(-12px); }
        .liquid { width: 100%; height: 37px; border-top: 1px solid rgba(255,255,255,0.1); }
        .red { background: #ff4444; } .blue { background: #0099ff; } .green { background: #00cc66; }
        button { 
            margin-top: 40px; padding: 12px 28px; background: #007aff; 
            border: none; color: white; border-radius: 20px; font-weight: bold; font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Water Sort</h1>
    <p id="status">Tap a tube to begin</p>
    <div class="game-container" id="game"></div>
    <button onclick="initGame()">Reset Level</button>
    <script>
        let tubesData = [];
        let selectedIndex = null;
        function drawTubes() {
            const container = document.getElementById('game');
            container.innerHTML = '';
            tubesData.forEach((colors, index) => {
                const tube = document.createElement('div');
                tube.className = `tube ${selectedIndex === index ? 'selected' : ''}`;
                tube.onclick = () => handleTubeClick(index);
                colors.forEach(color => {
                    const liquid = document.createElement('div');
                    liquid.className = `liquid ${color}`;
                    tube.appendChild(liquid);
                });
                container.appendChild(tube);
            });
        }
        function handleTubeClick(index) {
            if (selectedIndex === null) {
                if (tubesData[index].length > 0) {
                    selectedIndex = index;
                    document.getElementById('status').innerText = "Select target tube";
                }
            } else {
                if (selectedIndex !== index) { pour(selectedIndex, index); }
                selectedIndex = null;
                document.getElementById('status').innerText = "Tap a tube to begin";
                checkWin();
            }
            drawTubes();
        }
        function pour(src, tgt) {
            let srcTube = tubesData[src], tgtTube = tubesData[tgt];
            if (srcTube.length === 0 || tgtTube.length >= 4) return;
            let colorToMove = srcTube[srcTube.length - 1];
            if (tgtTube.length > 0 && tgtTube[tgtTube.length - 1] !== colorToMove) return;
            tgtTube.push(srcTube.pop());
        }
        function checkWin() {
            let win = tubesData.every(t => t.length === 0 || (t.length === 4 && t.every(c => c === t[0])));
            if (win) document.getElementById('status').innerText = "🎉 YOU WIN! 🎉";
        }
        function initGame() {
            tubesData = [['red', 'blue', 'green', 'red'], ['blue', 'green', 'red', 'blue'], ['green', 'red', 'blue', 'green'], []];
            selectedIndex = null;
            drawTubes();
        }
        initGame();
    </script>
</body>
</html>
